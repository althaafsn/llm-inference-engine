[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "A small distributed LLM inference engine with admission control and HA"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["BLE001"]
